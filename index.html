<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10101c">
    <meta name="description" content="A collection of games, ready to play.">
    <title>Games — Play something fun</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10101c;
        color: #f7f5ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(1.25rem, 5vw, 4rem);
        background:
          radial-gradient(ellipse at 80% 4%, rgb(119 79 255 / 22%), transparent 34rem),
          radial-gradient(ellipse at 7% 55%, rgb(27 202 201 / 10%), transparent 28rem),
          #10101c;
      }

      main {
        width: min(100%, 68rem);
        margin: 0 auto;
      }

      .hero {
        position: relative;
        overflow: hidden;
        padding: clamp(2rem, 7vw, 5.5rem);
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 2rem;
        background: linear-gradient(125deg, rgb(36 32 66 / 96%), rgb(24 23 43 / 92%) 65%, rgb(39 31 69 / 92%));
        box-shadow: 0 2rem 6rem rgb(0 0 0 / 24%);
      }

      .hero::after {
        position: absolute;
        top: -5rem;
        right: -3rem;
        width: 18rem;
        aspect-ratio: 1;
        border: 1px solid rgb(255 255 255 / 9%);
        border-radius: 50%;
        box-shadow: 0 0 0 2rem rgb(255 255 255 / 2%), 0 0 0 4rem rgb(255 255 255 / 2%);
        content: "";
        pointer-events: none;
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #b6a8ff;
        font-size: 0.78rem;
        font-weight: 750;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(3rem, 8vw, 6.25rem);
        letter-spacing: -0.075em;
        line-height: 0.98;
      }

      .intro {
        max-width: 34rem;
        margin: 1.5rem 0 0;
        color: #c3bfd5;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }

      .library {
        padding: clamp(2.5rem, 6vw, 4.5rem) 0 1rem;
      }

      .library-heading {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      h2 {
        margin: 0;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        letter-spacing: -0.045em;
      }

      .library-heading p {
        margin: 0.4rem 0 0;
        color: #9692aa;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        min-width: 0;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 1.1rem;
        background: rgb(255 255 255 / 4%);
        color: #a7a3b8;
      }

      li a {
        display: flex;
        min-height: 5.5rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1.25rem 1.4rem;
        border-radius: inherit;
        color: #f7f5ff;
        font-size: 1.1rem;
        font-weight: 650;
        text-decoration: none;
        transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
      }

      li a::after {
        color: #b6a8ff;
        content: "↗";
        font-size: 1.25rem;
      }

      li a:hover {
        transform: translateY(-2px);
        background: rgb(182 168 255 / 9%);
      }

      li a:focus-visible {
        outline: 3px solid #b6a8ff;
        outline-offset: 3px;
      }

      li:not(:has(a)) {
        grid-column: 1 / -1;
        padding: 1.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">The game room</p>
        <h1>Play something fun.</h1>
        <p class="intro">A little collection of games for your next break. Pick one, jump in, and enjoy the moment.</p>
      </header>
      <section class="library" aria-labelledby="library-title">
        <div class="library-heading">
          <div>
            <h2 id="library-title">The collection</h2>
            <p>Choose your next adventure.</p>
          </div>
        </div>
        <ul>
          <!-- GAME_LIST_START -->
          <li>No games found yet.</li>
          <!-- GAME_LIST_END -->
        </ul>
      </section>
    </main>
  </body>
</html>
